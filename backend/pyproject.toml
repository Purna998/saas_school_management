[project]
name = "nepal-school-management-api"
version = "0.1.0"
description = "Modular FastAPI monolith for a multi-tenant school management platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.13.2",
    "asyncpg==0.30.0",
    "bcrypt==4.0.1",
    "cryptography==43.0.0",
    "fastapi==0.115.0",
    "httpx==0.27.0",
    "nepali-datetime==1.0.7",
    "passlib==1.7.4",
    "pydantic[email]==2.10.6",
    "pydantic-settings==2.7.1",
    "pyjwt[crypto]==2.9.0",
    "pyotp==2.9.0",
    "python-multipart==0.0.9",
    "pytz==2024.1",
    "qrcode[pil]==7.4.2",
    "redis[hiredis]>=5.2.1,<6",
    "sqlalchemy[asyncio]==2.0.32",
    "uvicorn[standard]==0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.2",
    "pytest-asyncio==0.23.8",
    "ruff==0.5.7",
]
